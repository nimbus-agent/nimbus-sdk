version: 2
updates:
  # `bun`, not `npm`. Dependabot treats Bun as its OWN ecosystem; the npm one does
  # not understand `bun.lock`, so it bumps package.json and leaves the lockfile
  # untouched — the resulting PR then fails CI at `bun install --frozen-lockfile`
  # with "lockfile had changes, but lockfile is frozen". Observed and fixed first in
  # nimbus-mcp-servers, which has enough dependencies to actually receive npm PRs;
  # this repo has the same misconfiguration, latent only because Dependabot rarely
  # opens one against it.
  #
  # Known limitation, recorded rather than rediscovered: the bun ecosystem supports
  # VERSION updates but not SECURITY updates. Dependabot *alerts* still fire — they
  # come from advisories, not from this config — so a vulnerability still surfaces in
  # the Security tab; what is lost is the automatically opened security-fix PR.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Bump all actions in a single grouped PR. Multi-step actions such as
    # github/codeql-action (init + analyze) MUST move together — a split bump
    # leaves the steps on mismatched versions and CodeQL hard-fails with
    # "Loaded a configuration file for version X, but running version Y".
    groups:
      github-actions:
        patterns:
          - "*"

  # The post-publish verification toolchain. Grouped for the same reason the
  # github-actions block is: pypi-attestations and sigstore are version-coupled, and a
  # split bump would land a combination neither project tests.
  #
  # Review these as release-infrastructure changes, not routine dependency noise — they
  # change the tool that decides whether a published artifact is trustworthy.
  #
  # This ecosystem also sees pyproject.toml. `[project] dependencies` is empty by policy
  # so there is nothing to bump there, but `[build-system] requires` is in scope and may
  # produce a PR.
  - package-ecosystem: "pip"
    directory: "/sdks/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      verify-toolchain:
        patterns:
          - "*"
