name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/typescript
    # SONAR_TOKEN is optional: the analysis step is skipped when it's absent, so
    # the check passes until the project is imported into SonarCloud and the
    # secret is set. Once configured, the scan waits on the quality gate and
    # fails the check on a gate ERROR (sonar.qualitygate.wait=true).
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            bun.sh:443
            sonarcloud.io:443
            api.sonarcloud.io:443
            scanner.sonarcloud.io:443
            binaries.sonarsource.com:443
            keyserver.ubuntu.com:443
            keys.openpgp.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so SonarCloud can attribute new-code via blame.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Coverage (lcov for Sonar)
        # Overrides the job default working-directory: the scan step below is a `uses:`
        # step that always runs from the repository root, so it resolves this report's
        # `SF:` paths against the repo root too. Running bun from the repo root (with the
        # package-qualified src path, which is what the root `test:coverage` script holds)
        # makes bun emit `SF:sdks/typescript/src/...`, which the scan step can resolve.
        #
        # The command lives in the root package.json rather than inline here so there is
        # ONE owner of that path invariant. `sdks/typescript` used to carry its own
        # `test:coverage` with a bare `src` path — the exact form this comment exists to
        # avoid — reachable by anyone who ran it from the package directory.
        working-directory: .
        run: bun run test:coverage
        env:
          CI: "true"

      - name: SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
