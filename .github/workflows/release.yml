name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The GitHub Environment `publish-python` deploys to, and the value the signing
  # certificate must name. Declared once here because `jobs.<id>.environment` accepts
  # only the github, needs, vars and inputs contexts — not `env` — so the literal below
  # cannot be replaced by an expression. release-workflow-guard.test.ts asserts the two
  # stay equal, so drift fails on the PR that causes it rather than after a publish.
  PYPI_ENVIRONMENT: pypi

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The org blocks GITHUB_TOKEN from creating pull requests, so release-please
    # opens its release PR with a token minted from the "Nimbus Release Bot"
    # GitHub App — the same App the monorepo and nimbus-client use. This retires
    # the last consumer of the org-wide RELEASE_PLEASE_PAT. App tokens are minted
    # per-run and expire in ~1h.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      ts_released: ${{ steps.release.outputs['sdks/typescript--release_created'] }}
      py_released: ${{ steps.release.outputs['sdks/python--release_created'] }}
      py_version: ${{ steps.release.outputs['sdks/python--version'] }}
      cc_released: ${{ steps.release.outputs['tools/create-connector--release_created'] }}
      cc_version: ${{ steps.release.outputs['tools/create-connector--version'] }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          repositories: nimbus-sdk
          permission-contents: write
          permission-pull-requests: write
          # release-please creates its autorelease:* label definitions via the
          # Issues API; see nimbus-client#8.
          permission-issues: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.ts_released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/typescript
    permissions:
      contents: read
      # Required for npm provenance + token-less OIDC trusted publishing.
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Publishing reaches npm + the sigstore provenance endpoints; audit
          # (not block) avoids brittle allowlist drift on the signing chain.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Setup Node (for npm publish --provenance)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm trusted publishing (token-less OIDC) requires npm >= 11.5.1, newer
      # than the version bundled with Node 22.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
        env:
          CI: "true"

      # Catch the two dominant causes of silent provenance degradation BEFORE
      # publishing. npm cannot unpublish after 72h, so a post-publish failure
      # reports damage rather than preventing it.
      - name: Preflight — OIDC available and npm meets the trusted-publishing floor
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_TOKEN is unset — the job lacks 'id-token: write'."
            echo "::error::Publishing now would succeed WITHOUT provenance and cannot be undone after 72h."
            exit 1
          fi
          have="$(npm --version)"
          need="11.5.1"
          # `sort -V` is a GNU coreutils extension. Both satellites run on
          # ubuntu-24.04, where it is guaranteed. If this job is ever moved to a
          # macOS runner, BSD sort has no -V and this comparison breaks — switch
          # to `gsort` or a Node one-liner at that point.
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "::error::npm $have is below the $need floor required for OIDC trusted publishing."
            exit 1
          fi
          echo "preflight ok: OIDC token present, npm $have >= $need"

      # No NODE_AUTH_TOKEN: the npm trusted-publisher binding for @nimbus-dev/sdk
      # authenticates this workflow via GitHub OIDC and attaches provenance.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

      - name: Resolve published version
        id: published
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # `npm audit signatures` verifies the registry signatures of the packages
      # in the CURRENT tree. Run in the repo root it would audit our own
      # dependencies — which never includes the package we just shipped. To
      # cryptographically verify the published artifact it must be installed
      # from the registry into a clean tree first. Verified live against
      # @nimbus-dev/sdk@1.3.0: "1 package has a verified registry signature /
      # 1 package has a verified attestation", exit 0.
      - name: Verify the published tarball's registry signature (cryptographic)
        env:
          PUBLISHED_VERSION: ${{ steps.published.outputs.version }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          npm init -y >/dev/null
          # A publish is followed by TWO independent propagation lags, and each has
          # already turned a good release red:
          #
          #   * packument lag — `npm install pkg@<v>` fails ETARGET "No matching
          #     version found" while the version is still propagating.
          #   * attestation lag — the tarball installs fine while
          #     `/-/npm/v1/attestations/...` still 404s, so `npm audit signatures`
          #     fails on a package that is live and correctly attested. That is what
          #     made 1.5.0's publish job red: install succeeded on attempt 1, the loop
          #     broke, and the single audit that followed hit the 404. Minutes later
          #     the identical command reported a verified signature and attestation.
          #
          # So install and audit must retry TOGETHER — a loop that breaks on install
          # alone and audits once afterwards reads attestation lag as a supply-chain
          # failure. `--prefer-online` is also required: npm caches the negative
          # packument, so plain retries re-read the same cached 404 instead of asking
          # the registry again.
          verified=""
          for attempt in 1 2 3 4 5 6 7 8; do
            if npm install "@nimbus-dev/sdk@${PUBLISHED_VERSION}" \
                 --no-audit --no-fund --prefer-online \
              && npm audit signatures; then
              verified=1
              break
            fi
            if [ "$attempt" != 8 ]; then
              sleep $(( attempt * 10 ))
            fi
          done
          if [ -z "$verified" ]; then
            echo "::error::@nimbus-dev/sdk@${PUBLISHED_VERSION} could not be installed and signature-verified from the registry after 8 attempts (~4.5 min)."
            exit 1
          fi

      - name: Verify provenance names this repo, workflow and commit
        uses: nimbus-agent/.github/actions/verify-npm-provenance@5fb42792fa88287048fd24f704183b9a9b807a67
        with:
          package: "@nimbus-dev/sdk"
          version: ${{ steps.published.outputs.version }}
          expected-repo: nimbus-agent/nimbus-sdk
          expected-workflow: .github/workflows/release.yml
          expected-sha: ${{ github.sha }}
          severity: gate

  publish-create-connector:
    needs: release-please
    if: needs.release-please.outputs.cc_released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/create-connector
    permissions:
      contents: read
      # Required for npm provenance + token-less OIDC trusted publishing.
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Matches the SDK's publish job: audit, not block, so the sigstore signing chain's
          # endpoints cannot drift the allowlist out from under a release.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Setup Node (for npm publish --provenance)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm trusted publishing (token-less OIDC) requires npm >= 11.5.1, newer than the
      # version bundled with Node 22.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # release.yml and ci.yml fire independently off the same push, so this job cannot trust
      # that CI already ran against this exact tree. pack-and-generate.test.ts is in here: it
      # packs this package and generates from the tarball, so a `files` regression fails the
      # release rather than shipping.
      - name: Test
        run: bun test src/
        env:
          CI: "true"

      # npm can never unpublish a version after 72h, same as PyPI — see publish-python's
      # preflight, which this mirrors. It publishes package.json's version, so that version
      # must be checked before publishing rather than after.
      - name: Preflight — OIDC available, npm meets the trusted-publishing floor, and version matches the release
        env:
          RELEASED_VERSION: ${{ needs.release-please.outputs.cc_version }}
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_TOKEN is unset — the job lacks 'id-token: write'."
            echo "::error::Publishing now would succeed WITHOUT provenance and cannot be undone after 72h."
            exit 1
          fi
          have="$(npm --version)"
          need="11.5.1"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "::error::npm $have is below the $need floor required for OIDC trusted publishing."
            exit 1
          fi
          declared="$(node -p "require('./package.json').version")"
          if [ "$declared" != "$RELEASED_VERSION" ]; then
            echo "::error::package.json declares $declared but release-please released $RELEASED_VERSION."
            exit 1
          fi
          echo "preflight ok: OIDC token present, npm $have >= $need, version $declared"

      # No NODE_AUTH_TOKEN: the npm trusted-publisher binding for
      # @nimbus-dev/create-connector authenticates this workflow via GitHub OIDC. That binding
      # could only be created after a manual bootstrap publish of 0.0.0 — npm cannot configure
      # a trusted publisher for a package that does not yet exist (npm/cli#8544).
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

      - name: Verify the published tarball's registry signature (cryptographic)
        env:
          PUBLISHED_VERSION: ${{ needs.release-please.outputs.cc_version }}
        working-directory: .
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          npm init -y >/dev/null
          # Install and audit must retry TOGETHER: a publish is followed by packument lag AND
          # attestation lag, and a loop that breaks on install alone then audits once reads the
          # attestation 404 as a supply-chain failure. --prefer-online is mandatory because npm
          # caches the negative packument. See the SDK's publish job for the incident this
          # shape came from.
          verified=""
          for attempt in 1 2 3 4 5 6 7 8; do
            if npm install "@nimbus-dev/create-connector@${PUBLISHED_VERSION}" \
                 --no-audit --no-fund --prefer-online \
              && npm audit signatures; then
              verified=1
              break
            fi
            if [ "$attempt" != 8 ]; then
              sleep $(( attempt * 10 ))
            fi
          done
          if [ -z "$verified" ]; then
            echo "::error::@nimbus-dev/create-connector@${PUBLISHED_VERSION} could not be installed and signature-verified from the registry after 8 attempts (~4.5 min)."
            exit 1
          fi

      - name: Verify provenance names this repo, workflow and commit
        uses: nimbus-agent/.github/actions/verify-npm-provenance@5fb42792fa88287048fd24f704183b9a9b807a67
        with:
          package: "@nimbus-dev/create-connector"
          version: ${{ needs.release-please.outputs.cc_version }}
          expected-repo: nimbus-agent/nimbus-sdk
          expected-workflow: .github/workflows/release.yml
          expected-sha: ${{ github.sha }}
          severity: gate

  # Split from publish-create-connector for the same reason verify-python-publish is split from
  # its publish job: this one only downloads and reads, so it is safe to re-run as many times as
  # propagation lag requires, whereas re-running the publish would retry the upload.
  #
  # This job is the ONLY thing that executes the two invocations the quickstarts document. No
  # pre-publish job can: `npm create @nimbus-dev/connector` and
  # `npx @nimbus-dev/create-connector` both resolve against the registry. The `--lang python`
  # line matters most — `npm create` would eat that flag as its own config, handing a Python
  # author a TypeScript project with no error, which is why the docs use npx for it.
  smoke-create-connector:
    needs: [release-please, publish-create-connector]
    if: needs.release-please.outputs.cc_released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Run both documented invocations against the registry
        env:
          PUBLISHED_VERSION: ${{ needs.release-please.outputs.cc_version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"

          # npm's own flags go BEFORE the package spec in both forms — that is the same parsing
          # rule that decided the Python line. --prefer-online written after the spec would be
          # an argument to the scaffolder, which rejects unknown options by design.
          # --yes suppresses the "Ok to proceed?" prompt, which non-interactively is a hang.
          #
          # DO NOT rewrite these two lines as `npm exec`. They are copied verbatim from
          # docs/quickstart-*.md and tools/create-connector/README.md, and executing the line the
          # docs do NOT contain would prove the wrong thing — the `--lang`-swallow hazard lives
          # in the difference between these forms. If a doc line changes, change it here too.
          REG="--registry=https://registry.npmjs.org/"

          # Retry shape copied from the two loops release.yml already runs: 8 attempts,
          # sleep attempt*10, ~4.5 min. A publish is followed by packument and tarball
          # propagation lag that has already turned two good releases red.
          #
          # The CLI refuses to write into a directory that exists and is not empty (exit 2,
          # TargetNotEmptyError). If an attempt fails after it has started writing, the
          # target is left non-empty, and every remaining attempt then fails on THAT rather
          # than on the propagation lag being retried — a good publish would report a red
          # smoke job. So `try` takes the target directory and clears it before each
          # attempt, not just before the first.
          try() {
            local target="$1"
            shift
            for attempt in 1 2 3 4 5 6 7 8; do
              rm -rf "$target"
              if "$@"; then return 0; fi
              if [ "$attempt" != 8 ]; then sleep $(( attempt * 10 )); fi
            done
            return 1
          }

          if ! try ts-smoke npm create --yes --prefer-online $REG \
                 "@nimbus-dev/connector@${PUBLISHED_VERSION}" ts-smoke; then
            echo "::error::the documented \`npm create\` line failed against the registry"
            exit 1
          fi

          if ! try py-smoke npx --yes --prefer-online $REG \
                 "@nimbus-dev/create-connector@${PUBLISHED_VERSION}" py-smoke --lang python; then
            echo "::error::the documented \`npx --lang python\` line failed against the registry"
            exit 1
          fi

          # The language assertion is the point, not the exit code. If npm ate --lang, py-smoke
          # is a TypeScript project and every check below still "succeeded".
          if [ ! -f ts-smoke/package.json ] || [ ! -f ts-smoke/main.ts ]; then
            echo "::error::npm create produced no TypeScript project; got: $(ls ts-smoke)"
            exit 1
          fi
          if [ ! -f py-smoke/pyproject.toml ] || [ -f py-smoke/package.json ]; then
            echo "::error::npx --lang python produced a TypeScript project — the flag was swallowed; got: $(ls py-smoke)"
            exit 1
          fi
          if [ ! -f ts-smoke/.gitignore ] || [ ! -f py-smoke/.gitignore ]; then
            echo "::error::a generated project has no .gitignore — npm stripped it from the published tarball"
            exit 1
          fi
          echo "smoke ok: npm create -> TypeScript, npx --lang python -> Python, both with .gitignore"

  publish-python:
    needs: release-please
    if: needs.release-please.outputs.py_released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Must match the PyPI Trusted Publisher binding exactly, and this environment
    # restricts deployments to `main`, so no branch or fork can mint the OIDC identity.
    environment: pypi
    permissions:
      contents: read
      # The entire authentication story. There is no PyPI token.
      id-token: write
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Publishing reaches PyPI plus the Sigstore attestation endpoints; audit (not
          # block) avoids brittle allowlist drift on the signing chain, matching npm.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # release.yml and ci.yml fire independently off the same push, so this job cannot
      # trust that CI already ran against this exact tree — mirrors the npm publish job,
      # which re-runs Build/Typecheck/Test before its own preflight for the same reason.
      # `hatchling` is listed explicitly even though it is only a build backend:
      # `pip install -e .` builds in an isolated environment and does NOT install the
      # backend into this one, while `mypy --strict` type-checks `hatch_build.py`, which
      # imports it. See ci.yml's `python` job for the matching comment.
      #
      # verify-requirements.txt is here for the same reason it is there: mypy also
      # type-checks scripts/verify_publish.py and tests/test_verify_publish.py, which
      # import pypi_attestations, sigstore, cryptography and pyasn1 — none of which
      # `pip install -e .` provides, because this package is dependency-free by policy.
      # Omitting it here while ci.yml had it is what broke the 0.1.2 release: this job
      # runs only when release-please cuts a Python version, so no pull request could
      # reach it, and the gap stayed invisible from the commit that introduced the
      # imports until the next release fired. release-workflow-guard.test.ts now asserts
      # the two install blocks agree.
      - name: Install, lint, typecheck and test
        run: |
          python -m pip install --upgrade pip build hatchling ruff mypy pytest
          python -m pip install --require-hashes -r verify-requirements.txt
          python -m pip install -e .
          python -m ruff check . && python -m ruff format --check .
          python -m mypy
          python -m pytest -q

      # PyPI can never re-upload a version, even after deletion, so both of these must
      # fail BEFORE anything is published rather than reporting damage afterwards.
      - name: Preflight — OIDC available and version matches the release
        env:
          RELEASED_VERSION: ${{ needs.release-please.outputs.py_version }}
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_TOKEN is unset — the job lacks 'id-token: write'."
            echo "::error::Publishing now would succeed WITHOUT attestations and cannot be undone."
            exit 1
          fi
          declared="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$declared" != "$RELEASED_VERSION" ]; then
            echo "::error::pyproject.toml declares $declared but release-please released $RELEASED_VERSION."
            exit 1
          fi
          echo "preflight ok: OIDC token present, version $declared"

      # `build` was already installed by the step above; no need to reinstall it here.
      - name: Build sdist and wheel
        run: python -m build

      # Nothing between build and publish inspects dist/ otherwise. A hatchling upgrade,
      # a .gitignore change, or a build-hook regression could drop `_data/` silently, and
      # `packages-dir` uploads everything it finds — this is the last chance to refuse a
      # publish that would permanently ship an empty or wrong-version package.
      #
      # Extracted to scripts/gate_dist.py so every branch is reachable from an offline
      # unit test. As a heredoc the only way to exercise it was to cut a release.
      - name: Gate the built distributions
        env:
          RELEASED_VERSION: ${{ needs.release-please.outputs.py_version }}
        run: python scripts/gate_dist.py dist "$RELEASED_VERSION"

      # No password: the pending publisher binds this repo + workflow + environment via
      # OIDC. `attestations` defaults to true for Trusted Publishing, but is set
      # explicitly so an action upgrade cannot silently drop provenance.
      #
      # No `skip-existing: true`: on an irreversible registry a 400 "File already
      # exists" on a re-run means the version is genuinely already published — that
      # needs a human to verify what actually shipped, not a silent no-op that could
      # mask a real collision.
      - name: Publish to PyPI with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdks/python/dist
          attestations: true

  # Split from publish-python so a failure here has a green re-run path: re-running a
  # failed `publish-python` would retry the upload itself, which dies on PyPI's 400
  # "File already exists" — this job only ever downloads and reads, so it is safe to
  # rerun as many times as propagation lag requires.
  verify-python-publish:
    needs: [release-please, publish-python]
    if: needs.release-please.outputs.py_released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Reaches PyPI plus the Sigstore/Fulcio-backed integrity API; audit (not
          # block) avoids brittle allowlist drift on the signing chain, matching npm.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # pyproject.toml is the single source of truth for the distribution name — the
      # same file the publish preflight reads the version from. Normalised per PEP 503
      # because that is the form PyPI's URLs use.
      - name: Resolve the distribution name
        run: |
          set -euo pipefail
          name="$(python - <<'PY'
          import re, tomllib
          raw = tomllib.load(open("pyproject.toml", "rb"))["project"]["name"]
          print(re.sub(r"[-_.]+", "-", raw).lower())
          PY
          )"
          echo "DIST_NAME=$name" >> "$GITHUB_ENV"
          echo "resolved distribution name: $name"

      # A publish is followed by a CDN propagation lag, and reading it as a
      # supply-chain failure turns a good release red. The npm side learned this the
      # hard way. --no-cache-dir is mandatory: pip caches the negative index response,
      # so plain retries replay the same 404. --only-binary=:all: is mandatory too:
      # without it, `pip download` can resolve to an sdist while the wheel is still
      # propagating — breaking the retry loop early on the wrong artifact, and running
      # a build backend during what should be a read-only verification step.
      - name: Download the published wheel from PyPI
        env:
          PUBLISHED_VERSION: ${{ needs.release-please.outputs.py_version }}
        run: |
          set -euo pipefail
          # Start from an empty directory so the wheel picked below is unambiguously the
          # one this run downloaded, not a leftover from an earlier attempt.
          rm -rf /tmp/verify && mkdir -p /tmp/verify

          verified=""
          for attempt in 1 2 3 4 5 6 7 8; do
            if python -m pip download --no-deps --no-cache-dir --only-binary=:all: \
                 --index-url https://pypi.org/simple/ \
                 --dest /tmp/verify "${DIST_NAME}==${PUBLISHED_VERSION}"; then
              verified=1
              break
            fi
            if [ "$attempt" != 8 ]; then
              sleep $(( attempt * 10 ))
            fi
          done
          if [ -z "$verified" ]; then
            echo "::error::${DIST_NAME}==${PUBLISHED_VERSION} was not installable from PyPI after 8 attempts."
            exit 1
          fi

          # Insist on a wheel. `--only-binary=:all:` should already guarantee this, but
          # an unguarded glob on a missing wheel would expand to nothing and silently
          # build a malformed integrity URL below that 404s and reads as lag.
          wheel="$(find /tmp/verify -maxdepth 1 -name '*.whl' | head -n1)"
          if [ -z "$wheel" ]; then
            echo "::error::no wheel downloaded for ${PUBLISHED_VERSION} — got: $(ls /tmp/verify)"
            exit 1
          fi
          echo "WHEEL_PATH=$wheel" >> "$GITHUB_ENV"
          echo "WHEEL_NAME=$(basename "$wheel")" >> "$GITHUB_ENV"

      - name: Install the pinned verification toolchain
        run: python -m pip install --require-hashes -r verify-requirements.txt

      - name: Fetch the PEP 740 provenance from PyPI
        env:
          PUBLISHED_VERSION: ${{ needs.release-please.outputs.py_version }}
        run: |
          set -euo pipefail
          provenance_ok=""
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --retry 0 \
                 "https://pypi.org/integrity/${DIST_NAME}/${PUBLISHED_VERSION}/${WHEEL_NAME}/provenance" \
                 -o /tmp/provenance.json; then
              provenance_ok=1
              break
            fi
            if [ "$attempt" != 6 ]; then
              sleep $(( attempt * 10 ))
            fi
          done
          if [ -z "$provenance_ok" ]; then
            echo "::error::PyPI returned no provenance for ${WHEEL_NAME} — it was published WITHOUT attestations."
            exit 1
          fi
          echo "PROVENANCE_PATH=/tmp/provenance.json" >> "$GITHUB_ENV"

      # Cryptographic Sigstore verification, not a claims read. The expected identity is
      # composed from THIS run's own context — repository, workflow_ref, commit, and the
      # environment constant above — so PyPI's `publisher` object is never used as input.
      # It is the registry's own claim about the upload, and grading it against itself
      # would prove nothing.
      #
      # The environment is checked from the certificate rather than through the policy
      # because pypi-attestations' GitHubPublisher does not enforce it: passing a wrong
      # environment verifies successfully. See scripts/verify_publish.py.
      - name: Verify the PEP 740 attestation (cryptographic)
        run: python scripts/verify_publish.py
