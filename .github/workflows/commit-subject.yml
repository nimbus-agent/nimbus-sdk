name: Commit Subject

# release-please reads the commits that land on `main`, and this repo merges by squash
# only — so for a PR that collects a stack, the PR title is the only subject the parser
# will ever see. This job asserts that subject is a Conventional Commit and that it does
# not declare less than the commits it carries. See docs/CONTRIBUTING.md, "Stacking a
# multi-part change".
#
# A separate workflow, not a job inside ci.yml: the guard reads the pull request TITLE,
# and a squash merge makes that title the commit subject release-please parses — so a
# title edited after a green run must re-trigger the check, or a PR can pass as `feat!:`
# and merge as `fix:`. ci.yml's `pull_request:` trigger carries no `types:` key, so it
# uses the default set (opened, synchronize, reopened), which excludes `edited`. Simply
# adding `edited` to ci.yml would re-run the entire workflow — the cross-OS build-test
# matrix, the node-smoke matrix, conformance, both scaffold jobs — on every title edit.
# Hence a lightweight workflow of its own, which is also why this job does not opt out
# via `if:` on a non-pull_request event: once branch protection marks `commit-guard` as
# a required check (RFC-0015 Shipment 5's still-outstanding deployment step — see
# docs/ROADMAP.md), a run that never reports a check because `if:` skipped the job
# blocks the PR forever, since GitHub has no way to read "skipped" as "not applicable"
# for a required check. So the job always reports a real conclusion, by exiting 0 from
# the inside with an explanatory note rather than by not running at all.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  commit-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            bun.sh:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # No `bun install` — the guard imports nothing outside scripts/.
      - name: Check the subject that will land on main
        run: bun run sdks/typescript/scripts/conventional-commit-guard.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
