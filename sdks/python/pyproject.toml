[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nimbus-dev-sdk"
version = "0.11.1"
description = "The MIT-licensed, dependency-free authoring contract for Nimbus connectors and extensions — Python binding."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nimbus" }]
keywords = ["nimbus", "mcp", "connector", "sdk", "contract"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nimbus-agent/nimbus-sdk"
Repository = "https://github.com/nimbus-agent/nimbus-sdk"
Changelog = "https://github.com/nimbus-agent/nimbus-sdk/blob/main/sdks/python/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/nimbus_sdk"]
# Hatchling selects files by VCS: anything git ignores is excluded, and `packages`
# only narrows within that tracked set. `_data/` is generated at build time AND
# gitignored, so without this it is silently absent from the built distribution —
# producing a package that installs cleanly, imports fine, and carries no contract
# data at all. `artifacts` is the escape hatch for exactly this case.
artifacts = ["src/nimbus_sdk/_data/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "CHANGELOG.md", "pyproject.toml", "hatch_build.py"]
# test_gate_dist.py and test_verify_publish.py import module-level from scripts/, which
# is deliberately NOT shipped (see scripts/gate_dist.py and scripts/verify_publish.py's
# own docstrings), and their dependencies (pypi-attestations, sigstore, cryptography,
# pyasn1) are not [project].dependencies either — a downstream packager who unpacks the
# sdist and runs pytest gets a collection error. Shipping tests for code that is not
# shipped is incoherent regardless of whether the imports error or skip, so both are
# excluded outright rather than guarded with importorskip.
exclude = ["tests/test_gate_dist.py", "tests/test_verify_publish.py"]
artifacts = ["src/nimbus_sdk/_data/**"]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts", "hatch_build.py"]
# `scripts/` is not a package and is not on sys.path, so mypy needs to be told where
# `import gate_dist` resolves from. Mirrors the pytest `pythonpath` setting below.
mypy_path = "scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Release-infrastructure scripts live outside the package on purpose — they must not
# ship — so tests import them via this path rather than from `nimbus_sdk`.
pythonpath = ["scripts"]
markers = [
  "slow: builds a distribution and installs it into a throwaway venv",
  # Opt-in via NIMBUS_VERIFY_INTEGRATION. There is no `addopts` deselecting markers in
  # this project, so a marker alone excludes nothing — `slow` runs on every PR today.
  # The skipif on these tests is what keeps the default suite offline; the marker is
  # documentation for `-m network`.
  "network: reaches PyPI and the Sigstore trust root; opt-in via NIMBUS_VERIFY_INTEGRATION",
]
