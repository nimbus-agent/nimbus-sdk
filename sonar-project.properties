# SonarQube Cloud (SonarCloud) configuration for nimbus-sdk.
# Project must be imported into the `nimbus-agent` SonarCloud org and a
# SONAR_TOKEN repo/org secret set; the sonar.yml workflow skips analysis when
# the token is absent.

sonar.organization=nimbus-agent
sonar.projectKey=nimbus-agent_nimbus-sdk
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Tests live alongside source in src/ (**/*.test.ts).
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts

# The sandbox probe is a standalone binary the harness *spawns*, not a module anything
# imports: it ends in a top-level `await main()` that calls process.exit(), so importing it
# from a test would terminate the test run. It can never appear in an in-process coverage
# report, and reports 0% forever.
#
# This is not a gap being waved away. RFC-0004 extracted the part of it that IS testable —
# the errno-to-exit-code classification, the one piece a binding in another language must
# reproduce exactly — into src/testing/sandbox-protocol.ts, which is covered directly and
# driven by the conformance corpus. What is left in the probe is I/O and dispatch, and
# scripts/probe-runtime.test.ts asserts the property that actually matters about it: that it
# calls no runtime-specific global, so it works under whatever runtime the consumer spawns.
sonar.coverage.exclusions=src/testing/sandbox-probe.ts

# bun test --coverage --coverage-reporter=lcov writes coverage/lcov.info.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.typescript.tsconfigPaths=tsconfig.json

# Block CI on the Quality Gate verdict (the scan action waits + exits non-zero
# on gate ERROR). Uses the built-in "Sonar way" gate.
sonar.qualitygate.wait=true
