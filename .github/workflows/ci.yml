name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which paths changed, and therefore which jobs are worth running. The filters live in
  # .github/path-filters.yml so a guard can read them; see that file for why every list is
  # deliberately generous, and sdks/typescript/scripts/path-filters.test.ts for what holds
  # them honest.
  #
  # This job must SUCCEED for a skip downstream to mean anything, which ci-complete asserts.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      python: ${{ steps.filter.outputs.python }}
      go: ${{ steps.filter.outputs.go }}
      scaffold: ${{ steps.filter.outputs.scaffold }}
      conformance: ${{ steps.filter.outputs.conformance }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yml
          # On a pull request, diff against the base branch. On a push, this is left empty
          # and the action falls back to the default branch -- which IS the pushed branch,
          # so it diffs against the previous commit and CAN report a filter false.
          #
          # That is why the job gates below carry `|| github.event_name == 'push'` rather
          # than relying on this input to make everything true. The full matrix on main is
          # load-bearing: strict_required_status_checks_policy is FALSE, so a merged tree
          # can differ from the one CI tested, and the push run is the only thing that
          # tests the tree that actually landed. A guarantee that important should not
          # depend on a third-party action's default for an empty input.
          base: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}

  build-test:
    needs: changes
    # `|| push` forces the full matrix on main; see the changes job for why.
    if: needs.changes.outputs.typescript == 'true' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdks/typescript
    timeout-minutes: 20
    steps:
      # harden-runner supports egress *blocking* on Linux only; Windows and macOS are
      # audit-mode only. Rather than weaken the Linux job to a common denominator, keep
      # block where it is available and record egress everywhere else.
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            bun.sh:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Build before Test: the declaration-map meta-check and the API-surface guard
      # both assert dist/ output.
      - name: Build
        run: bun run build

      - name: Test
        run: bun run test
        env:
          CI: "true"

      # The scaffolder copies trees and rewrites path segments, so it runs on the same
      # three-OS matrix as the SDK. Windows path separators are exactly the bug this catches.
      - name: Typecheck the scaffolder
        working-directory: tools/create-connector
        run: bun run typecheck

      - name: Lint the scaffolder
        working-directory: tools/create-connector
        run: bun run lint

      # pack-and-generate.test.ts runs the CLI out of a tarball packed from dist/, so dist/ has
      # to exist. This also gets the scaffolder's own build covered on all three OSes, which it
      # was not before.
      - name: Build the scaffolder
        working-directory: tools/create-connector
        run: bun run build

      - name: Test the scaffolder
        working-directory: tools/create-connector
        run: bun test src/

      # One tarball is published and loaded on every OS, so one build is what the
      # smoke jobs must exercise — not a per-OS rebuild the ecosystem never receives.
      - name: Upload dist for the Node smoke jobs
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          # `uses:` steps ignore defaults.run.working-directory — this path is repo-relative.
          path: sdks/typescript/dist/
          retention-days: 1

  node-smoke:
    needs: [changes, build-test]
    # `|| push` forces the full matrix on main; see the changes job for why.
    if: needs.changes.outputs.typescript == 'true' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: ["22", "24"]
        # macOS runs the newer Node only. This job's claim is that the PUBLISHED
        # tarball loads and decodes correctly on each OS's Node, and one version is
        # enough to make that claim per OS -- the two-version axis exists to catch a
        # Node-version regression, which is OS-independent and still covered twice.
        # macOS queues ~7 min per job against ~1.5 min elsewhere, so a job dropped
        # there is worth four dropped anywhere else.
        exclude:
          - os: macos-15
            node: "22"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Download the ubuntu-built dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: sdks/typescript/dist

      - name: Smoke the published ESM entry points
        run: node sdks/typescript/scripts/smoke-esm.mjs

      # The Bun guard proves src/ conforms; this proves the artifact consumers receive
      # conforms on the runtime they run it under. Not the same claim: framing bottoms
      # out in TextDecoder, whose edge behavior differs between Bun and Node.
      - name: Run the framing conformance corpus
        run: node sdks/typescript/scripts/framing-node.mjs

  python:
    needs: changes
    # `|| push` forces the full matrix on main; see the changes job for why.
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ["3.11", "3.12", "3.13", "3.14"]
        # Every supported version runs on Ubuntu; macOS and Windows run the OLDEST and
        # NEWEST only. The two axes test different things and do not need multiplying:
        # a language-semantics difference between 3.12 and 3.13 is OS-independent, and
        # the OS-dependent behaviour this package has -- urllib's transport, and
        # distribution-channel's path handling -- does not vary by minor version. 3.11
        # and 3.14 bracket requires-python on every OS, so a version-gated syntax or
        # stdlib change still fails on the edge that would ship broken.
        exclude:
          - os: macos-15
            python: "3.12"
          - os: macos-15
            python: "3.13"
          - os: windows-2025
            python: "3.12"
          - os: windows-2025
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # `hatchling` is listed explicitly even though it is only a build backend:
      # `pip install -e .` builds in an isolated environment and does NOT install the
      # backend into this one, while `mypy --strict` type-checks `hatch_build.py`,
      # which imports it. Without this the CI lint step fails on a missing import that
      # never reproduces locally, because a developer who ran a build has it already.
      #
      # verify-requirements.txt is here for exactly the same reason one layer along:
      # mypy also type-checks scripts/verify_publish.py, which imports
      # pypi_attestations, sigstore, cryptography and pyasn1 — none of which
      # `pip install -e .` provides, because this package is dependency-free by policy.
      # Installing them beats an `ignore_missing_imports` override, which would hollow
      # out strict mode over the code that decides whether a release is trustworthy.
      - name: Install
        run: |
          python -m pip install --upgrade pip build hatchling ruff mypy pytest
          python -m pip install --require-hashes -r verify-requirements.txt
          python -m pip install -e .

      - name: Lint
        run: python -m ruff check . && python -m ruff format --check .

      - name: Typecheck
        run: python -m mypy

      - name: Test
        run: python -m pytest -q

  go:
    needs: changes
    # `|| push` forces the full matrix on main; see the changes job for why.
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        go: ["1.26", "1.27"]
        # macOS runs the newer minor only. Go's two-minor policy is about the LANGUAGE
        # and toolchain, which is OS-independent, and both minors still run on Ubuntu
        # and Windows. The OS axis is what this module actually needs on macOS: the
        # go:embed spec mirror and the filepath handling in connectorkit.
        exclude:
          - os: macos-15
            go: "1.26"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/go
    env:
      # A module with zero dependencies needs no MODULE downloads, so this job needs no
      # proxy.golang.org or sum.golang.org allowance — a property neither other language
      # has. It is not the same as needing no network: actions/setup-go still fetches a
      # toolchain (see allowed-endpoints below). GOTOOLCHAIN=local suppresses the `go`
      # command's own toolchain fetch, which is a different mechanism happening later.
      GOTOOLCHAIN: local
      # Two guards skip when the file they compare against is missing, because a
      # consumer running `go test ./...` on the downloaded module has no checkout:
      # spec/drift_test.go without docs/spec, and internal/apisurface/cmd's golden
      # test without docs/api-surface-go.md. Here both files exist, so an absent
      # one is a path typo — this turns each skip into a failure.
      NIMBUS_SPEC_DRIFT: required
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            dl.google.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub runners preinstall ONE Go version. The matrix asks for two, so setup-go
      # downloads the other from Google's storage host — which is why the two endpoints
      # above are allowed. Without them the Linux leg dies here, before a single test.
      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Check formatting
        shell: bash
        # `gofmt -l` prints misformatted filenames and exits 0, so on its own it can
        # never fail a build. `go vet` does not cover formatting either.
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  # The cross-language conformance matrix: one job whose axis is LANGUAGE, running each
  # binding's corpus suite with NIMBUS_CONFORMANCE_REPORT set and uploading what it executed.
  # `conformance-report` below reconciles the three against docs/conformance-coverage.json.
  #
  # Linux only, three legs, deliberately. Cross-OS coverage already exists: build-test,
  # python and go each run their full suite — corpora included — on ubuntu, macos and
  # windows. This job's axis is language; an OS axis would re-run per-OS coverage that
  # already exists and triple the heterogeneous-toolchain flake surface for nothing.
  #
  # The corpus tests consequently run twice on Linux. That is accepted: they are the fast
  # part of each suite, and the alternative is either dropping them from the per-language
  # jobs — making a local `pytest -q` a weaker check than CI — or having no job whose axis is
  # language at all.
  conformance:
    needs: changes
    # `|| push` forces the full matrix on main; see the changes job for why.
    if: needs.changes.outputs.conformance == 'true' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, python, go]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NIMBUS_CONFORMANCE_REPORT: ${{ github.workspace }}/conformance-reports
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            bun.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            storage.googleapis.com:443
            dl.google.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # The TypeScript leg runs the guards under Bun AND framing-node.mjs under plain Node.
      # framing is deliberately driven twice — TextDecoder's edge behaviour differs between
      # the runtimes — so it reports two producers the reconciler unions.
      # The guards are listed one by one rather than as `bun test scripts/`, which would also
      # pull in api-surface / smoke-calls / docs-snippets — three gates that execute dist/ and
      # belong to build-test, not here. A NEW guard added later is not listed, its corpus goes
      # unrecorded, and the reconciler fails: loud, and in the right place.
      #
      # rules-guard is absent on purpose. It guards the rule REGISTRY and executes no manifest
      # case, so it records nothing.
      #
      # Build FIRST. schema-guard compares the emitted dist/index.d.ts against the published
      # JSON Schemas and fails outright without it ("dist/ has been built"), and
      # framing-node.mjs imports @nimbus-dev/sdk/ipc. This is its own step so a build failure
      # is not misread as a conformance failure — and it is a separate concern from the three
      # gates left out of the guard list below, which is why listing those out was not enough.
      - name: Build
        if: matrix.language == 'typescript'
        working-directory: sdks/typescript
        run: bun run build

      - name: Run the TypeScript corpus guards
        if: matrix.language == 'typescript'
        working-directory: sdks/typescript
        run: |
          bun test \
            scripts/canonical-json-guard.test.ts \
            scripts/data-profile-guard.test.ts \
            scripts/diagnostics-guard.test.ts \
            scripts/distribution-channel-guard.test.ts \
            scripts/framing-guard.test.ts \
            scripts/icalendar-guard.test.ts \
            scripts/jmap-guard.test.ts \
            scripts/manifest-signature-guard.test.ts \
            scripts/negotiation-guard.test.ts \
            scripts/path-filters.test.ts \
            scripts/predicates-guard.test.ts \
            scripts/sandbox-guard.test.ts \
            scripts/schema-guard.test.ts \
            scripts/url-resolution-guard.test.ts

      # framing's SECOND producer, under plain Node rather than Bun — the whole point of it,
      # since TextDecoder's edge behaviour differs.
      - name: Run the framing corpus under plain Node
        if: matrix.language == 'typescript'
        working-directory: sdks/typescript
        run: node scripts/framing-node.mjs

      # manifest-signature's `ed25519` kind pins the RUNTIME's Ed25519, not anything this
      # package exports. Bun ships BoringSSL and Node ships OpenSSL; they agree today, and
      # a Bun-only leg is structurally incapable of noticing if they stop.
      - name: Run the manifest-signature corpus under plain Node
        if: matrix.language == 'typescript'
        working-directory: sdks/typescript
        run: node scripts/ed25519-node.mjs

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Two things this step must NOT do, both of which look right and both of which fail.
      #
      # `pip install -e .` does not bring pytest: [project].dependencies is empty by policy,
      # so pytest is installed explicitly, exactly as the `python` job does.
      #
      # And it runs the four corpus modules by name rather than `tests/`. The full directory
      # cannot work here: test_verify_publish.py imports `cryptography` at module level and
      # test_gate_dist.py imports from scripts/, neither of which `pip install -e .` provides
      # — the `python` job installs verify-requirements.txt for exactly that reason. Pulling
      # a hash-pinned attestation toolchain into a job about conformance corpora would be the
      # wrong fix. A new corpus module not listed here goes unrecorded and the reconciler
      # fails, which is the same loud-in-the-right-place property the TypeScript leg has.
      - name: Run the Python corpus suite
        if: matrix.language == 'python'
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
          python -m pytest -q \
            tests/test_negotiation_corpus.py \
            tests/test_framing_corpus.py \
            tests/test_diagnostics_corpus.py \
            tests/test_url_resolution_corpus.py \
            tests/test_data_profile_corpus.py \
            tests/test_distribution_channel_corpus.py \
            tests/test_icalendar_corpus.py \
            tests/test_jmap_corpus.py \
            tests/test_canonical_json_corpus.py \
            tests/test_manifest_signature_corpus.py

      # `go-version-file` rather than a literal, so this is not a third place to update when
      # the supported minors move. The policy is the two most recent stable minors with the
      # go.mod directive naming the OLDER of the two; GOTOOLCHAIN=local means a mismatch here
      # would fail the leg outright rather than quietly downloading a toolchain. Reading the
      # directive keeps them in sync by construction.
      #
      # This leg therefore runs one Go version, the floor. The `go` job above is what covers
      # both minors; this job's axis is language.
      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdks/go/go.mod
          cache: false

      # No NIMBUS_SPEC_DRIFT here, deliberately. Only spec/drift_test.go reads it, and this
      # step builds ./conformance's tests alone — so setting it would be inert, and an inert
      # env var reads as a guarantee this step does not provide. The `go` job runs `./...`
      # and is where that guard lives.
      - name: Run the Go conformance suite
        if: matrix.language == 'go'
        env:
          GOTOOLCHAIN: local
        # -count=1 is load-bearing: a cached pass writes no report files at all.
        run: go -C sdks/go test -count=1 ./conformance/

      # `warn` is the default and is precisely wrong here: a leg whose test command matched
      # no files would go green having uploaded nothing, and the failure would surface a job
      # later as a puzzling reconciliation error instead of here.
      - name: Upload the conformance reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-${{ matrix.language }}
          path: conformance-reports/
          if-no-files-found: error
          retention-days: 1

  # Hold docs/conformance-coverage.json TRUE by execution: every corpus a binding claims was
  # run, case for case, in THIS run. A leg that FAILS never reaches here — `needs:` requires
  # success, so this job is skipped and ci-complete's `skipped` check reddens the run.
  conformance-report:
    needs: [conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            bun.sh:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # merge-multiple flattens all three artifacts into one directory, which is what the
      # reconciler globs.
      - name: Download every leg's reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: conformance-*
          merge-multiple: true
          path: conformance-reports

      - name: Reconcile
        run: bun run sdks/typescript/scripts/conformance-reconcile.ts conformance-reports

  # The scaffolder's output has to be a project someone can actually run, and nothing above
  # proves that: `build-test` only typechecks and unit-tests the generator. These two jobs
  # pack the SDK from *this* commit, generate a connector, install the packed artifact into
  # it, run the generated project's own suite, and then drive the built connector as a
  # process to assert its handshake exit codes.
  #
  # Neither job caches dependencies, deliberately. A warm cache would resolve a dependency
  # range that has since gone bad and stay green — which is the exact failure these jobs
  # exist to surface.
  #
  # Both run *declared floors* rather than whatever the runner image happens to ship: Node 22,
  # which is `engines.node` for the scaffolder and for the TypeScript template, and Python
  # 3.11, which is the Python template's `requires-python`. A floor nothing executes is a
  # promise nobody is keeping, and an unpinned toolchain quietly changes what is being tested.
  scaffold-typescript:
    needs: changes
    # `|| push` forces the full matrix on main; see the changes job for why.
    if: needs.changes.outputs.scaffold == 'true' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    # A broken template does not hang, it crawls: the generated suite's split-frame case
    # takes its full 10 s timeout to fail. Most of this budget is `npm install`.
    timeout-minutes: 20
    steps:
      # Single-OS job, so `block` unconditionally. The matrices above degrade to `audit`
      # only because harden-runner cannot block on Windows or macOS.
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # registry.npmjs.org is what this job is *for*: the generated project installs its
          # own dependencies from it, so a template whose ranges have gone bad fails here
          # rather than in an author's terminal months from now. bun.sh and nodejs.org are
          # the two toolchains, and nothing else is reachable.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            bun.sh:443
            nodejs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # Pinned to the floor `engines.node` declares — the scaffolder's, and here also the
      # generated project's, since this is the Node the template is tested on. `scaffold-python`
      # pins the same version for the scaffolder alone.
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Pack the SDK from this commit
        run: |
          cd sdks/typescript
          bun run build
          bun pm pack --destination "$RUNNER_TEMP"

      # Packed, not run from the checkout. `files` decides what a real author receives, and a
      # file it omits — npm silently drops `.gitignore` from every tarball, which is why the
      # templates carry `_gitignore` — is invisible to a job that runs dist/ in place.
      # src/pack-and-generate.test.ts asserts the two trees match; this job then installs and
      # runs what the tarball produced.
      - name: Pack the scaffolder from this commit
        run: |
          bun run --cwd tools/create-connector build
          cd tools/create-connector
          npm pack --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/nimbus-dev-create-connector-*.tgz -C "$RUNNER_TEMP"

      # Outside the repository tree on purpose. Inside it, Node resolution walks up to the
      # workspace node_modules and satisfies @nimbus-dev/sdk from there — which is the one
      # resolution a real author never has, and it would make this job green for the wrong
      # reason.
      - name: Generate a connector from the packed scaffolder
        run: |
          cd "$RUNNER_TEMP"
          node "$RUNNER_TEMP/package/dist/index.js" demo-connector --dir "$RUNNER_TEMP/demo-connector"

      # The tarball goes in first and on purpose: `npm install <tarball>` rewrites the
      # dependency to a `file:` specifier, so the template's `^1.12.0` range is never
      # resolved from the registry and the SDK under test is the one this commit built.
      # Every *other* dependency still comes from npm, which is the range check.
      - name: Install the packed SDK and the project's own dependencies
        run: |
          cd "$RUNNER_TEMP/demo-connector"
          npm install "$RUNNER_TEMP"/nimbus-dev-sdk-*.tgz
          npm install

      # `pretest` runs typecheck+build, so `npm test` needs no separate build step.
      - name: Test the generated project
        run: |
          cd "$RUNNER_TEMP/demo-connector"
          npm test

      # The suite above already drives the binary, but only through its own harness. This
      # is the gateway's view: two frames in, two exit codes out.
      - name: Drive it — agreement exits 0, a disjoint set exits 20
        run: |
          cd "$RUNNER_TEMP/demo-connector"
          hello() { printf '{"nimbus":"hello","contractVersions":["%s"]}\n' "$1"; }

          # A connector that never notices EOF would otherwise hang until the job's own
          # 20-minute limit and be reported as "exceeded the maximum execution time", which
          # names nothing. timeout(1) turns that into an attributable failure. 124 is its
          # own exit code for the timeout case and collides with neither 0 nor 20, so it is
          # checked first and never mistaken for a refusal.
          set +e
          agreed_out=$(hello 1 | timeout 60 node dist/main.js)
          agreed=$?
          refused_out=$(hello 2 | timeout 60 node dist/main.js)
          refused=$?
          set -e

          echo "agreement: exit=$agreed stdout=$agreed_out"
          echo "refusal:   exit=$refused stdout=$refused_out"

          if [ "$agreed" -eq 124 ] || [ "$refused" -eq 124 ]; then
            echo "::error::the connector did not exit within 60s (agreement=$agreed refusal=$refused); 124 is timeout(1)'s, not a handshake exit code"
            exit 1
          fi
          if [ "$agreed" -ne 0 ]; then
            echo "::error::an agreed version set must exit 0, got $agreed"
            exit 1
          fi
          if ! printf '%s' "$agreed_out" | grep -q '"nimbus":"hello"'; then
            echo "::error::the connector must answer the hello before serving; stdout was: $agreed_out"
            exit 1
          fi
          if [ "$refused" -ne 20 ]; then
            echo "::error::a disjoint version set must exit 20, got $refused"
            exit 1
          fi

  scaffold-python:
    needs: changes
    # `|| push` forces the full matrix on main; see the changes job for why.
    if: needs.changes.outputs.scaffold == 'true' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    # Same shape as scaffold-typescript; here the slow part is resolving `mcp` and pydantic.
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # pypi.org + files.pythonhosted.org are what this job is for — the generated
          # project's own dependency resolution. registry.npmjs.org, bun.sh and nodejs.org are
          # here only because the scaffolder is itself a TypeScript program that has to be
          # built and run before it can emit a Python project; nothing Python-side touches npm.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            registry.npmjs.org:443
            bun.sh:443
            nodejs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # Pinned for the same reason `scaffold-typescript` pins it, though here Node only runs
      # the scaffolder: the runtime under test in this job is Python's.
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # The floor the template's own `requires-python` declares.
      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install
        run: bun install --frozen-lockfile

      # `--wheel` skips the sdist, so `$RUNNER_TEMP` holds exactly one installable artifact
      # and the glob below cannot become ambiguous.
      - name: Build the SDK wheel from this commit
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel sdks/python --outdir "$RUNNER_TEMP"

      - name: Pack the scaffolder from this commit
        run: |
          bun run --cwd tools/create-connector build
          cd tools/create-connector
          npm pack --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/nimbus-dev-create-connector-*.tgz -C "$RUNNER_TEMP"

      # Outside the repository tree for the same reason as the TypeScript job: an editable
      # install of the SDK, or a stray `src/` on the path, would satisfy `nimbus_sdk` from
      # the checkout instead of from the artifact under test.
      - name: Generate a connector from the packed scaffolder
        run: |
          cd "$RUNNER_TEMP"
          node "$RUNNER_TEMP/package/dist/index.js" demo-connector --lang python --dir "$RUNNER_TEMP/demo-connector"

      - name: Install the packed SDK and the project's own dependencies
        run: |
          cd "$RUNNER_TEMP/demo-connector"
          # The wheel first: `nimbus-dev-sdk>=0.3.0` need not resolve from PyPI at the
          # version this commit builds, and installing it up front satisfies the requirement
          # so the editable install never asks. Note the underscores — PEP 427 normalises
          # `-` to `_` in wheel filenames, so this glob does *not* spell the distribution
          # name the way the npm tarball does.
          python -m pip install "$RUNNER_TEMP"/nimbus_dev_sdk-*.whl
          # `[dev]` is not optional in practice: pytest, mypy and ruff all live in that
          # extra, so a bare `pip install -e .` gets as far as "No module named pytest".
          python -m pip install -e ".[dev]"

      # Ordering is not provenance. The step above works today only because the wheel's version
      # happens to satisfy the template's `nimbus-dev-sdk>=0.3.0`, so pip finds the requirement
      # already met and never asks the index. The moment that floor rises above the version this
      # commit builds — or the wheel carries a pre-release qualifier, which a bare `>=` will not
      # accept — pip silently resolves the *published* SDK and this job goes green having tested
      # something other than the commit under review. The TypeScript side cannot do that:
      # `npm install <tarball>` rewrites the dependency to `file:` unconditionally. This is the
      # equivalent assertion, and it is the difference between "installed first" and
      # "installed from here".
      - name: Assert the SDK under test is the wheel this commit built
        run: |
          cd "$RUNNER_TEMP/demo-connector"
          wheel=$(basename "$(ls "$RUNNER_TEMP"/nimbus_dev_sdk-*.whl)")
          # PEP 427 filename grammar: {distribution}-{version}-{python}-{abi}-{platform}.whl
          expected=$(echo "$wheel" | cut -d- -f2)

          installed=$(python -c 'import importlib.metadata as m; print(m.version("nimbus-dev-sdk"))')
          origin=$(python -c 'import nimbus_sdk; print(nimbus_sdk.__file__)')
          # PEP 610: pip writes direct_url.json only for artifacts installed from a file or a
          # URL, and omits it for anything resolved from an index. Its presence, naming this
          # wheel, is the provenance claim; the version check below only localises a mismatch.
          direct=$(python -c 'import importlib.metadata as m; print(m.distribution("nimbus-dev-sdk").read_text("direct_url.json") or "")')

          echo "built here:      $wheel (version $expected)"
          echo "installed:       $installed"
          echo "imported from:   $origin"
          echo "direct_url.json: ${direct:-<absent>}"

          # Ordered most-specific first, so the message names the actual cause rather than a
          # symptom of it.
          if [ "$installed" != "$expected" ]; then
            echo "::error::the generated project resolved nimbus-dev-sdk $installed, but this commit built $expected — pip satisfied the requirement from PyPI instead of from the wheel"
            exit 1
          fi
          case "$origin" in
            "$GITHUB_WORKSPACE"/*)
              echo "::error::nimbus_sdk imported from the checkout ($origin), not from the installed wheel — the generated project is reading this repository's source instead of the artifact under test"
              exit 1
              ;;
          esac
          case "$origin" in
            *site-packages*) ;;
            *)
              echo "::error::nimbus_sdk imported from $origin, which is not a site-packages directory"
              exit 1
              ;;
          esac
          case "$direct" in
            *"$wheel"*) ;;
            *)
              echo "::error::nimbus-dev-sdk was not installed from $wheel — no PEP 610 direct_url.json names it, and pip writes none at all for a package resolved from an index; direct_url.json was: ${direct:-<absent>}"
              exit 1
              ;;
          esac

      - name: Test the generated project
        run: |
          cd "$RUNNER_TEMP/demo-connector"
          python -m pytest -q

      - name: Drive it — agreement exits 0, a disjoint set exits 20
        run: |
          cd "$RUNNER_TEMP/demo-connector"
          hello() { printf '{"nimbus":"hello","contractVersions":["%s"]}\n' "$1"; }

          # See scaffold-typescript's drive step: 124 is timeout(1)'s exit code, it collides
          # with neither 0 nor 20, and it is checked before either.
          set +e
          agreed_out=$(hello 1 | timeout 60 python -m demo_connector.main)
          agreed=$?
          refused_out=$(hello 2 | timeout 60 python -m demo_connector.main)
          refused=$?
          set -e

          echo "agreement: exit=$agreed stdout=$agreed_out"
          echo "refusal:   exit=$refused stdout=$refused_out"

          if [ "$agreed" -eq 124 ] || [ "$refused" -eq 124 ]; then
            echo "::error::the connector did not exit within 60s (agreement=$agreed refusal=$refused); 124 is timeout(1)'s, not a handshake exit code"
            exit 1
          fi
          if [ "$agreed" -ne 0 ]; then
            echo "::error::an agreed version set must exit 0, got $agreed"
            exit 1
          fi
          if ! printf '%s' "$agreed_out" | grep -q '"nimbus":"hello"'; then
            echo "::error::the connector must answer the hello before serving; stdout was: $agreed_out"
            exit 1
          fi
          if [ "$refused" -ne 20 ]; then
            echo "::error::a disjoint version set must exit 20, got $refused"
            exit 1
          fi

  # The single required status check.
  #
  # `build-test` and `node-smoke` are matrices, so their job names carry the matrix
  # leg — `build-test (ubuntu-24.04)`, `node-smoke (macos-15, 22)`, and so on. A
  # ruleset that names those directly has to be hand-edited every time the matrix
  # changes shape, and it will: Node 26 enters LTS on 2026-10-28. This job is the one
  # stable name to require. It succeeds only if every job it needs succeeded, so the
  # matrices can grow without anyone touching repository settings.
  #
  # `if: always()` is load-bearing — without it this job would be skipped when a
  # dependency fails, the required check would never report, and PRs would hang
  # waiting for a status that never arrives.
  ci-complete:
    needs: [changes, build-test, node-smoke, python, go, conformance, conformance-report, scaffold-typescript, scaffold-python]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      # `skipped` used to be a failure here, and that blanket rule was what made this gate
      # trustworthy. Path filtering removes it — a job skipped because its paths did not
      # change is a normal outcome now. These two steps put back a narrower guarantee.
      #
      # THIS ONE FIRST, and it is the important one: a skip only means "the filter said so"
      # if the filter actually ran and succeeded. Without it, a `changes` job that failed or
      # was cancelled would skip every downstream job and this gate would report green — the
      # exact silent pass path filtering introduces.
      - name: A skip means nothing unless the filter succeeded
        if: needs.changes.result != 'success'
        run: echo "::error::the changes filter did not succeed (${{ needs.changes.result }}) — every downstream skip is untrustworthy, so CI cannot be called complete" && exit 1

      - name: Fail unless every CI job succeeded or was filtered out
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: echo "::error::CI did not fully succeed — changes=${{ needs.changes.result }} build-test=${{ needs.build-test.result }} node-smoke=${{ needs.node-smoke.result }} python=${{ needs.python.result }} go=${{ needs.go.result }} conformance=${{ needs.conformance.result }} conformance-report=${{ needs.conformance-report.result }} scaffold-typescript=${{ needs.scaffold-typescript.result }} scaffold-python=${{ needs.scaffold-python.result }}" && exit 1
