name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # harden-runner supports egress *blocking* on Linux only; Windows and macOS are
      # audit-mode only. Rather than weaken the Linux job to a common denominator, keep
      # block where it is available and record egress everywhere else.
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            bun.sh:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Build before Test: the declaration-map meta-check and the API-surface guard
      # both assert dist/ output.
      - name: Build
        run: bun run build

      - name: Test
        run: bun run test
        env:
          CI: "true"

      # One tarball is published and loaded on every OS, so one build is what the
      # smoke jobs must exercise — not a per-OS rebuild the ecosystem never receives.
      - name: Upload dist for the Node smoke jobs
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  node-smoke:
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Download the ubuntu-built dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Smoke the published ESM entry points
        run: node scripts/smoke-esm.mjs

  # The single required status check.
  #
  # `build-test` and `node-smoke` are matrices, so their job names carry the matrix
  # leg — `build-test (ubuntu-24.04)`, `node-smoke (macos-15, 22)`, and so on. A
  # ruleset that names those directly has to be hand-edited every time the matrix
  # changes shape, and it will: Node 26 enters LTS on 2026-10-28. This job is the one
  # stable name to require. It succeeds only if every job it needs succeeded, so the
  # matrices can grow without anyone touching repository settings.
  #
  # `if: always()` is load-bearing — without it this job would be skipped when a
  # dependency fails, the required check would never report, and PRs would hang
  # waiting for a status that never arrives.
  ci-complete:
    needs: [build-test, node-smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Fail unless every CI job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: echo "::error::CI did not fully succeed — build-test=${{ needs.build-test.result }} node-smoke=${{ needs.node-smoke.result }}" && exit 1
