name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The org blocks GITHUB_TOKEN from creating pull requests, so release-please
    # opens its release PR with a token minted from the "Nimbus Release Bot"
    # GitHub App — the same App the monorepo and nimbus-client use. This retires
    # the last consumer of the org-wide RELEASE_PLEASE_PAT. App tokens are minted
    # per-run and expire in ~1h.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      ts_released: ${{ steps.release.outputs['sdks/typescript--release_created'] }}
      py_released: ${{ steps.release.outputs['sdks/python--release_created'] }}
      py_version: ${{ steps.release.outputs['sdks/python--version'] }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          repositories: nimbus-sdk
          permission-contents: write
          permission-pull-requests: write
          # release-please creates its autorelease:* label definitions via the
          # Issues API; see nimbus-client#8.
          permission-issues: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.ts_released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/typescript
    permissions:
      contents: read
      # Required for npm provenance + token-less OIDC trusted publishing.
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # Publishing reaches npm + the sigstore provenance endpoints; audit
          # (not block) avoids brittle allowlist drift on the signing chain.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Setup Node (for npm publish --provenance)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm trusted publishing (token-less OIDC) requires npm >= 11.5.1, newer
      # than the version bundled with Node 22.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
        env:
          CI: "true"

      # Catch the two dominant causes of silent provenance degradation BEFORE
      # publishing. npm cannot unpublish after 72h, so a post-publish failure
      # reports damage rather than preventing it.
      - name: Preflight — OIDC available and npm meets the trusted-publishing floor
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_TOKEN is unset — the job lacks 'id-token: write'."
            echo "::error::Publishing now would succeed WITHOUT provenance and cannot be undone after 72h."
            exit 1
          fi
          have="$(npm --version)"
          need="11.5.1"
          # `sort -V` is a GNU coreutils extension. Both satellites run on
          # ubuntu-24.04, where it is guaranteed. If this job is ever moved to a
          # macOS runner, BSD sort has no -V and this comparison breaks — switch
          # to `gsort` or a Node one-liner at that point.
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "::error::npm $have is below the $need floor required for OIDC trusted publishing."
            exit 1
          fi
          echo "preflight ok: OIDC token present, npm $have >= $need"

      # No NODE_AUTH_TOKEN: the npm trusted-publisher binding for @nimbus-dev/sdk
      # authenticates this workflow via GitHub OIDC and attaches provenance.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

      - name: Resolve published version
        id: published
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # `npm audit signatures` verifies the registry signatures of the packages
      # in the CURRENT tree. Run in the repo root it would audit our own
      # dependencies — which never includes the package we just shipped. To
      # cryptographically verify the published artifact it must be installed
      # from the registry into a clean tree first. Verified live against
      # @nimbus-dev/sdk@1.3.0: "1 package has a verified registry signature /
      # 1 package has a verified attestation", exit 0.
      - name: Verify the published tarball's registry signature (cryptographic)
        env:
          PUBLISHED_VERSION: ${{ steps.published.outputs.version }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          npm init -y >/dev/null
          # A publish is followed by TWO independent propagation lags, and each has
          # already turned a good release red:
          #
          #   * packument lag — `npm install pkg@<v>` fails ETARGET "No matching
          #     version found" while the version is still propagating.
          #   * attestation lag — the tarball installs fine while
          #     `/-/npm/v1/attestations/...` still 404s, so `npm audit signatures`
          #     fails on a package that is live and correctly attested. That is what
          #     made 1.5.0's publish job red: install succeeded on attempt 1, the loop
          #     broke, and the single audit that followed hit the 404. Minutes later
          #     the identical command reported a verified signature and attestation.
          #
          # So install and audit must retry TOGETHER — a loop that breaks on install
          # alone and audits once afterwards reads attestation lag as a supply-chain
          # failure. `--prefer-online` is also required: npm caches the negative
          # packument, so plain retries re-read the same cached 404 instead of asking
          # the registry again.
          verified=""
          for attempt in 1 2 3 4 5 6 7 8; do
            if npm install "@nimbus-dev/sdk@${PUBLISHED_VERSION}" \
                 --no-audit --no-fund --prefer-online \
              && npm audit signatures; then
              verified=1
              break
            fi
            if [ "$attempt" != 8 ]; then
              sleep $(( attempt * 10 ))
            fi
          done
          if [ -z "$verified" ]; then
            echo "::error::@nimbus-dev/sdk@${PUBLISHED_VERSION} could not be installed and signature-verified from the registry after 8 attempts (~4.5 min)."
            exit 1
          fi

      - name: Verify provenance names this repo, workflow and commit
        uses: nimbus-agent/.github/actions/verify-npm-provenance@5fb42792fa88287048fd24f704183b9a9b807a67
        with:
          package: "@nimbus-dev/sdk"
          version: ${{ steps.published.outputs.version }}
          expected-repo: nimbus-agent/nimbus-sdk
          expected-workflow: .github/workflows/release.yml
          expected-sha: ${{ github.sha }}
          severity: gate

  publish-python:
    needs: release-please
    if: needs.release-please.outputs.py_released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Must match the PyPI Trusted Publisher binding exactly, and this environment
    # restricts deployments to `main`, so no branch or fork can mint the OIDC identity.
    environment: pypi
    permissions:
      contents: read
      # The entire authentication story. There is no PyPI token.
      id-token: write
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # Publishing reaches PyPI plus the Sigstore attestation endpoints; audit (not
          # block) avoids brittle allowlist drift on the signing chain, matching npm.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # release.yml and ci.yml fire independently off the same push, so this job cannot
      # trust that CI already ran against this exact tree — mirrors the npm publish job,
      # which re-runs Build/Typecheck/Test before its own preflight for the same reason.
      # `hatchling` is listed explicitly even though it is only a build backend:
      # `pip install -e .` builds in an isolated environment and does NOT install the
      # backend into this one, while `mypy --strict` type-checks `hatch_build.py`, which
      # imports it. See ci.yml's `python` job for the matching comment.
      - name: Install, lint, typecheck and test
        run: |
          python -m pip install --upgrade pip build hatchling ruff mypy pytest
          python -m pip install -e .
          python -m ruff check . && python -m ruff format --check .
          python -m mypy
          python -m pytest -q

      # PyPI can never re-upload a version, even after deletion, so both of these must
      # fail BEFORE anything is published rather than reporting damage afterwards.
      - name: Preflight — OIDC available and version matches the release
        env:
          RELEASED_VERSION: ${{ needs.release-please.outputs.py_version }}
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_TOKEN is unset — the job lacks 'id-token: write'."
            echo "::error::Publishing now would succeed WITHOUT attestations and cannot be undone."
            exit 1
          fi
          declared="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$declared" != "$RELEASED_VERSION" ]; then
            echo "::error::pyproject.toml declares $declared but release-please released $RELEASED_VERSION."
            exit 1
          fi
          echo "preflight ok: OIDC token present, version $declared"

      # `build` was already installed by the step above; no need to reinstall it here.
      - name: Build sdist and wheel
        run: python -m build

      # Nothing between build and publish inspects dist/ otherwise. A hatchling upgrade,
      # a .gitignore change, or a build-hook regression could drop `_data/` silently, and
      # `packages-dir` uploads everything it finds — this is the last chance to refuse a
      # publish that would permanently ship an empty or wrong-version package.
      - name: Gate the built distributions
        env:
          RELEASED_VERSION: ${{ needs.release-please.outputs.py_version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, os, sys, tarfile, zipfile
          version = os.environ["RELEASED_VERSION"]
          files = sorted(glob.glob("dist/*"))
          wheels = [f for f in files if f.endswith(".whl")]
          sdists = [f for f in files if f.endswith(".tar.gz")]
          if len(wheels) != 1 or len(sdists) != 1 or len(files) != 2:
              print(f"::error::dist/ must hold exactly one wheel and one sdist, got {files}", flush=True)
              sys.exit(1)
          for path in files:
              if version not in os.path.basename(path):
                  print(f"::error::{path} is not version {version} — it would be uploaded anyway", flush=True)
                  sys.exit(1)
          in_wheel = [n for n in zipfile.ZipFile(wheels[0]).namelist() if "/_data/" in n]
          in_sdist = [n for n in tarfile.open(sdists[0]).getnames() if "/_data/" in n]
          if not in_wheel:
              print("::error::wheel ships NO contract data (_data/) — refusing to publish", flush=True)
              sys.exit(1)
          if not in_sdist:
              print("::error::sdist ships NO contract data (_data/) — refusing to publish", flush=True)
              sys.exit(1)
          print(f"dist ok: wheel {len(in_wheel)} / sdist {len(in_sdist)} data files at {version}")
          PY

      # No password: the pending publisher binds this repo + workflow + environment via
      # OIDC. `attestations` defaults to true for Trusted Publishing, but is set
      # explicitly so an action upgrade cannot silently drop provenance.
      #
      # No `skip-existing: true`: on an irreversible registry a 400 "File already
      # exists" on a re-run means the version is genuinely already published — that
      # needs a human to verify what actually shipped, not a silent no-op that could
      # mask a real collision.
      - name: Publish to PyPI with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdks/python/dist
          attestations: true

  # Split from publish-python so a failure here has a green re-run path: re-running a
  # failed `publish-python` would retry the upload itself, which dies on PyPI's 400
  # "File already exists" — this job only ever downloads and reads, so it is safe to
  # rerun as many times as propagation lag requires.
  verify-python-publish:
    needs: [release-please, publish-python]
    if: needs.release-please.outputs.py_released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # Reaches PyPI plus the Sigstore/Fulcio-backed integrity API; audit (not
          # block) avoids brittle allowlist drift on the signing chain, matching npm.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # A publish is followed by a CDN propagation lag, and reading it as a
      # supply-chain failure turns a good release red. The npm side learned this the
      # hard way. --no-cache-dir is mandatory: pip caches the negative index response,
      # so plain retries replay the same 404. --only-binary=:all: is mandatory too:
      # without it, `pip download` can resolve to an sdist while the wheel is still
      # propagating — breaking the retry loop early on the wrong artifact, and running
      # a build backend during what should be a read-only verification step.
      - name: Download the published wheel from PyPI
        env:
          PUBLISHED_VERSION: ${{ needs.release-please.outputs.py_version }}
        run: |
          set -euo pipefail
          # Start from an empty directory so the wheel picked below is unambiguously the
          # one this run downloaded, not a leftover from an earlier attempt.
          rm -rf /tmp/verify && mkdir -p /tmp/verify

          verified=""
          for attempt in 1 2 3 4 5 6 7 8; do
            if python -m pip download --no-deps --no-cache-dir --only-binary=:all: \
                 --index-url https://pypi.org/simple/ \
                 --dest /tmp/verify "nimbus-dev-sdk==${PUBLISHED_VERSION}"; then
              verified=1
              break
            fi
            if [ "$attempt" != 8 ]; then
              sleep $(( attempt * 10 ))
            fi
          done
          if [ -z "$verified" ]; then
            echo "::error::nimbus-dev-sdk==${PUBLISHED_VERSION} was not installable from PyPI after 8 attempts."
            exit 1
          fi

          # Insist on a wheel. `--only-binary=:all:` should already guarantee this, but
          # an unguarded glob on a missing wheel would expand to nothing and silently
          # build a malformed integrity URL below that 404s and reads as lag.
          wheel="$(find /tmp/verify -maxdepth 1 -name '*.whl' | head -n1)"
          if [ -z "$wheel" ]; then
            echo "::error::no wheel downloaded for ${PUBLISHED_VERSION} — got: $(ls /tmp/verify)"
            exit 1
          fi
          echo "WHEEL_PATH=$wheel" >> "$GITHUB_ENV"
          echo "WHEEL_NAME=$(basename "$wheel")" >> "$GITHUB_ENV"

      - name: Verify PEP 740 provenance names this repo and commit
        env:
          PUBLISHED_VERSION: ${{ needs.release-please.outputs.py_version }}
          EXPECTED_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # PEP 740 provenance, from PyPI's integrity API.
          provenance_ok=""
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --retry 0 \
                 "https://pypi.org/integrity/nimbus-dev-sdk/${PUBLISHED_VERSION}/${WHEEL_NAME}/provenance" \
                 -o /tmp/provenance.json; then
              provenance_ok=1
              break
            fi
            if [ "$attempt" != 6 ]; then
              sleep $(( attempt * 10 ))
            fi
          done
          if [ -z "$provenance_ok" ]; then
            echo "::error::PyPI returned no provenance for ${WHEEL_NAME} — it was published WITHOUT attestations."
            exit 1
          fi

          # This checks the CLAIMS in PyPI's integrity document — publisher identity,
          # subject digest, and the commit named in the Fulcio cert — not a Sigstore
          # signature. Cryptographic verification via `pypi-attestations` is a
          # worthwhile follow-up; it is not added here because an unproven CLI has no
          # place on an irreversible publish path.
          #
          # PEP 740 publish attestations carry `predicate: null` — the commit SHA is
          # NOT in the in-toto statement. It lives only in the Fulcio signing
          # certificate, as plain ASCII inside the base64-DER blob: a `\b`-anchored
          # regex fails there because DER surrounds the hex string with non-word bytes,
          # so this uses bytes containment instead. `publisher.workflow` is reported as
          # a BASENAME (`release.yml`), not the `.github/workflows/release.yml` path
          # verify-npm-provenance compares on the npm side. Verified against a real
          # PyPI provenance document (pydantic 2.13.4) before this landed.
          python - <<'PY'
          import base64, hashlib, json, os, sys

          data = json.load(open("/tmp/provenance.json"))
          repo, sha = os.environ["EXPECTED_REPO"], os.environ["EXPECTED_SHA"]
          wheel, filename = os.environ["WHEEL_PATH"], os.environ["WHEEL_NAME"]

          bundles = data.get("attestation_bundles") or []
          if not bundles:
              print("::error::provenance document carries no attestation bundles", flush=True)
              sys.exit(1)

          ok = False
          for bundle in bundles:
              pub = bundle.get("publisher") or {}
              # PyPI reports the workflow BASENAME, not the path the npm job compares.
              if (pub.get("kind"), pub.get("repository"), pub.get("workflow"), pub.get("environment")) != (
                  "GitHub", repo, "release.yml", "pypi"
              ):
                  continue
              for att in bundle.get("attestations") or []:
                  stmt = json.loads(base64.b64decode(att["envelope"]["statement"]))
                  subject = stmt["subject"][0]
                  if subject["name"] != filename:
                      continue
                  digest = hashlib.sha256(open(wheel, "rb").read()).hexdigest()
                  if subject["digest"]["sha256"] != digest:
                      print(f"::error::attested digest does not match the downloaded {filename}", flush=True)
                      sys.exit(1)
                  cert = base64.b64decode(att["verification_material"]["certificate"])
                  if sha.encode() not in cert:
                      print(f"::error::signing certificate does not name commit {sha}", flush=True)
                      sys.exit(1)
                  ok = True

          if not ok:
              print(
                  f"::error::no attestation binds {filename} to {repo}@{sha} via release.yml / environment pypi",
                  flush=True,
              )
              sys.exit(1)
          print(f"provenance ok: {filename} attested by {repo}@{sha} via release.yml/pypi")
          PY
