name: Bug report
description: Report a problem with the Nimbus SDK (TypeScript, Python, Go or the scaffolder)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For issues in the gateway, connectors, Vault, or the
        HITL machinery, please use the
        [Nimbus](https://github.com/nimbus-agent/Nimbus) repository instead — this
        repo is only the MIT SDK contract.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: Package and version
      placeholder: "@nimbus-dev/sdk 2.0.0 / nimbus-dev-sdk 0.23.0 / sdks/go v0.22.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime & version
      placeholder: "Node 22.x / Bun 1.3.x / CPython 3.13 / Go 1.27"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Relevant details
      description: Minimal repro, stack trace, or the failing type/assertion.
      render: shell
